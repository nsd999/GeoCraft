name: Build GeoCraft APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore uploaded GeoCraft logo
        working-directory: android
        shell: bash
        env:
          GEOCRAFT_LOGO_B64: |
            
        run: |
          mkdir -p app/src/main/res/drawable
          printf '%s' "$GEOCRAFT_LOGO_B64" | base64 --decode > app/src/main/res/drawable/geocraft_logo.png
          rm -f app/src/main/res/drawable/geocraft_logo.xml

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoCraft-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
