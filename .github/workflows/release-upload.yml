name: Publish GeoCraft APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/release-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use existing compatible debug signing for sideload updates
        run: |
          echo "Building with the Android debug signing key so updates remain compatible with the existing v1.0.0 sideloaded APK."

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare update manifest
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          VERSION_CODE_REAL=$(grep "versionCode" android/app/build.gradle | sed -E "s/.*versionCode ([0-9]+).*/\1/")
          cat > update.json <<EOF
          {
            "package": "com.nsd.geocraft",
            "versionCode": $VERSION_CODE_REAL,
            "versionName": "$VERSION_NAME",
            "apk": "https://github.com/nsd999/GeoCraft/releases/download/v1.0.0/GeoCraft-v1.0.0.apk"
          }
          EOF

      - name: Prepare branded APK filename
        run: cp android/app/build/outputs/apk/release/app-release.apk GeoCraft-v1.0.0.apk

      - name: Upload updated APK and manifest to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 GeoCraft-v1.0.0.apk update.json             --repo "${{ github.repository }}"             --clobber
