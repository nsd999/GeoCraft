name: Publish GeoCraft APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/release-upload.yml'
      - 'CHANGELOG.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > geocraft-release.p12
          test -s geocraft-release.p12

      - name: Verify signing configuration
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::KEYSTORE_PASSWORD GitHub secret is missing." && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::KEY_ALIAS GitHub secret is missing." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::KEY_PASSWORD GitHub secret is missing." && exit 1)

      - name: Build signed release APK
        working-directory: android
        env:
          GEOCRAFT_KEYSTORE_PATH: ${{ github.workspace }}/geocraft-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare update manifest
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          VERSION_CODE_REAL=$(grep "versionCode" android/app/build.gradle | sed -E "s/.*versionCode ([0-9]+).*/\1/")
          export VERSION_CODE_REAL VERSION_NAME
          python3 - <<'PY'
          import json, os

          with open("CHANGELOG.json", "r", encoding="utf-8") as f:
              changelog = json.load(f)

          manifest = {
              "package": "com.nsd.geocraft",
              "versionCode": int(__import__("os").environ["VERSION_CODE_REAL"]),
              "versionName": __import__("os").environ["VERSION_NAME"],
              "apk": "https://github.com/nsd999/GeoCraft/releases/download/v1.0.0/GeoCraft-v1.0.0.apk",
              "changelog": changelog["releases"]
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Prepare branded APK filename
        run: cp android/app/build/outputs/apk/release/app-release.apk GeoCraft-v1.0.0.apk

      - name: Upload updated APK and manifest to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 GeoCraft-v1.0.0.apk update.json --repo "${{ github.repository }}" --clobber
