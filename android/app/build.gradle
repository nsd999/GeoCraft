plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nsd.geocraft'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nsd.geocraft'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("GEOCRAFT_KEYSTORE_PATH")
            def storePassword = System.getenv("KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("KEY_ALIAS")
            def keyPassword = System.getenv("KEY_PASSWORD")

            storeFile file(keystorePath)
            this.storePassword = storePassword
            this.keyAlias = keyAlias
            this.keyPassword = keyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
