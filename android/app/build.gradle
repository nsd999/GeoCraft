plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nsd.geocraft'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nsd.geocraft'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
